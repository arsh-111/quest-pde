# Build the serving image, smoke-test it, and publish it to GitHub Container Registry (ghcr.io).
# The image is pulled by Azure Container Apps (see README, "Deploy to Azure Container Apps").
name: docker-ghcr

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "qpde/**"
      - "checkpoints/**"
      - "deploy/**"
      - "scripts/stage_space.py"
      - ".github/workflows/docker-ghcr.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-ghcr-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  build-test-push:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Image name (lower case)
        run: echo "IMAGE=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Stage minimal build context (code, 6 served checkpoints, assets, Dockerfile)
        run: python scripts/stage_space.py build_ctx

      - uses: docker/setup-buildx-action@v3

      - name: Build image (linux/amd64, loaded locally for the smoke test)
        uses: docker/build-push-action@v6
        with:
          context: build_ctx
          platforms: linux/amd64
          load: true
          tags: ${{ env.IMAGE }}:ci
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.description=Sorption Surrogate Lab: FNO surrogate vs validated solver (PDEBench 1D diffusion-sorption)
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the container with real requests
        run: |
          set -euo pipefail
          docker run -d --name app -p 7860:7860 -e TORCH_NUM_THREADS=1 --memory 1g "$IMAGE:ci"
          start=$(date +%s)
          until curl -fsS localhost:7860/api/health > /dev/null; do
            sleep 1
            if [ $(( $(date +%s) - start )) -gt 120 ]; then docker logs app; exit 1; fi
          done
          echo "ready after $(( $(date +%s) - start )) s"
          curl -fsS localhost:7860/api/health
          curl -fsS -o /dev/null -w "predict %{http_code} %{time_total}s\n" -H 'Content-Type: application/json' \
            -d '{"ic":{"kind":"constant","level":0.1},"model":"ensemble"}' localhost:7860/api/predict
          curl -fsS -o /dev/null -w "compare %{http_code} %{time_total}s\n" -H 'Content-Type: application/json' \
            -d '{"ic":{"kind":"constant","level":0.1}}' localhost:7860/api/compare
          curl -fsS -o /dev/null -w "sweep %{http_code} %{time_total}s\n" -H 'Content-Type: application/json' \
            -d '{"param":"D","level":0.1,"n":3}' localhost:7860/api/physics_sweep
          curl -fsS -o /dev/null -w "index %{http_code}\n" localhost:7860/
          docker stats --no-stream --format "memory {{.MemUsage}}" app
          docker rm -f app

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push latest and sha tags
        run: |
          set -euo pipefail
          short=${GITHUB_SHA::7}
          docker tag "$IMAGE:ci" "$IMAGE:latest"
          docker tag "$IMAGE:ci" "$IMAGE:sha-$short"
          docker push "$IMAGE:latest"
          docker push "$IMAGE:sha-$short"
          echo "Pushed $IMAGE:latest and $IMAGE:sha-$short" >> "$GITHUB_STEP_SUMMARY"
